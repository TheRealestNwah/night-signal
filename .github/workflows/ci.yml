name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, unit and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  container:
    name: Production container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag night-signal-ci .
      - name: Start with persistent storage
        run: docker run --detach --name night-signal-ci --publish 127.0.0.1:3000:3000 --volume night-signal-ci-data:/app/data night-signal-ci
      - name: Verify health, frontend, audio, and database writes
        run: |
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:3000/api/health
          curl --fail --output /dev/null http://127.0.0.1:3000/
          curl --fail --output /dev/null http://127.0.0.1:3000/audio/windowlight.wav
          curl --fail --request POST --header 'Content-Type: application/json' --data '{"scene":"apartment"}' http://127.0.0.1:3000/api/rooms
          test "$(docker exec night-signal-ci id -u)" != "0"
      - name: Container logs
        if: failure()
        run: docker logs night-signal-ci
      - name: Stop container
        if: always()
        run: docker rm --force night-signal-ci || true
